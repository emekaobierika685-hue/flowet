# docker-compose.yml
#
# Single container. Single published port (:8080).
#   /api/create   → create + follow accounts
#   /api/console  → SSE live console (HTML)
#   /api/stats    → JSON counters
#   /api/health   → healthcheck
#   /solve        → standalone solver API (same in-process Funcaptcha instance)
#
# The solver runs in the same process as the generator — no second container,
# no port 5000, no inter-process HTTP.

version: "3.8"

services:
  generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: roblox-gen:latest
    container_name: roblox-gen
    restart: unless-stopped

    command: ["python", "-u", "account_creator.py"]

    ports:
      - "8080:8080"

    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "8080"
      TEMPMail_PROVIDER: "priyo"
      # Optional: require X-API-Key on /api/create and /solve
      # API_KEY: "change-me"

    volumes:
      - ./input:/app/input:ro
      - ./data:/app/data:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./output:/app/output
      - ./logs:/app/logs
      - ./solver-db:/app/solver-db

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
